<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FileForge — PDF'yi Word'e çevirin, PDF birleştirin, sıkıştırın ve daha fazlasını yapın. Dosyalarınız cihazınızdan çıkmaz." />
    <meta name="theme-color" content="#fafaf9" />
    <title>FileForge — Dosyalarınızı saniyeler içinde dönüştürün</title>
    <script>
      try {
        const stored = localStorage.getItem('fileforge.theme')
        if (stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (error) {
        /* ignore */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
